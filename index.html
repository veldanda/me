<style>
:root{--paper:#fff;--ink:#000;--red:#e8371c;--soft:rgba(0,0,0,.58)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Outfit','Hiragino Sans','Yu Gothic',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:4px}
#w{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
main,footer{position:relative;z-index:2}
#egg{position:fixed;z-index:5;pointer-events:none;font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;opacity:0;transition:opacity 1.2s}
#egg.on{opacity:.45}
#egg::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:9px;vertical-align:1px}
header{min-height:100svh;display:grid;place-content:center;text-align:center;padding:0 5vw}
h1{font-weight:800;font-size:clamp(2.8rem,10.2vw,9.5rem);letter-spacing:-.045em;line-height:1;white-space:nowrap}
h1 .c{display:inline-block;white-space:pre;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms + .2s)}
@keyframes rise{from{transform:translateY(.6em);opacity:0}}
.c{pointer-events:none}
.links a{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;transition:color .25s,transform .25s}
.links svg{width:28px;height:28px;overflow:visible;fill:currentColor}
.links a:hover{color:var(--red);transform:translateY(-3px)}
.links{margin-top:clamp(1.6rem,4vw,3rem);display:flex;justify-content:center;flex-wrap:wrap;gap:1rem 2.4rem}
@media(max-width:640px){h1{white-space:normal;font-size:clamp(3.2rem,18vw,6rem)}.links{gap:1rem 1.6rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header id="top">

<script>
const $=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
// split text into letters
function split(el){const t=el.textContent;el.dataset.t=t;el.setAttribute('aria-label',t);
  el.innerHTML=[...t].map((ch,i)=>`<span class="c" aria-hidden="true" style="--i:${i}">${ch}</span>`).join('')}
split($('#name')[0]);
// waves
const cv=$('#w')[0],g=cv.getContext('2d');
let W,H,mx=.5,my=.5,tx=.5,ty=.5,sy=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{tx=e.clientX/W;ty=e.clientY/H});
addEventListener('scroll',()=>sy=scrollY,{passive:true});
const N=18;
function draw(t){
  t*=.001;mx+=(tx-mx)*.05;my+=(ty-my)*.05;g.clearRect(0,0,W,H);
  const amp=24+Math.min(sy/30,46);
  for(let i=0;i<N;i++){
    const k=i/N,base=H*(.2+k*.75),hot=i===9;
    g.beginPath();
    for(let x=0;x<=W+8;x+=8){
      const dx=(x-mx*W)/(W*.16),dy=(base-my*H)/(H*.28);
      const y=base
        +Math.sin(x*.0042+t*.55+i*.34+sy*.0018)*amp*(.55+k)
        +Math.sin(x*.0115-t*.4+i*.9)*amp*.28
        -Math.exp(-dx*dx-dy*dy)*70;
      x?g.lineTo(x,y):g.moveTo(x,y)}
    g.lineWidth=hot?1.8:(i%6===0?1.3:.8);
    g.strokeStyle=hot?'rgba(232,55,28,.85)':`rgba(0,0,0,${i%6===0?.3:.14})`;
    g.stroke()}
  if(!reduce)requestAnimationFrame(draw)}
requestAnimationFrame(draw);
// easter eggs
const eggs=['all systems are a go','arigato gozaimasu','operators are standing by','dna morphing','algorithms instantiating'];
const egg=$('#egg')[0];let last=-1;
function showEgg(){
  let i;do{i=Math.random()*eggs.length|0}while(i===last);last=i;
  const v=Math.random()<.5?'top':'bottom',h=Math.random()<.5?'left':'right';
  egg.style.cssText=`${v}:${16+Math.random()*36}px;${h}:${16+Math.random()*36}px`;
  const txt=eggs[i];let k=0;egg.textContent='';egg.classList.add('on');
  const ty=setInterval(()=>{egg.textContent=txt.slice(0,++k);
    if(k>=txt.length){clearInterval(ty);setTimeout(()=>egg.classList.remove('on'),2600)}},reduce?0:55);
  setTimeout(showEgg,6500+Math.random()*5000)}
setTimeout(showEgg,2800);
</script>
